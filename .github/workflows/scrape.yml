name: Daily Medical News Collector

on:
  schedule:
    # 주 실행은 Cloudflare Worker 예약(06:10·13:10 KST, workflow_dispatch). GitHub 예약은 몇 시간씩 밀리거나 빠져서 예비로만 둠
    # 07:40·14:40 KST (UTC 22:40, 05:40) — 이번 회차(06:10·13:10)에 이미 실행이 있었으면 건너뜀
    - cron: '40 22,5 * * *'
  workflow_dispatch: # 수동 즉시 실행 (과거 기사 보충 시 값을 크게)
    inputs:
      days:
        description: '며칠 전 기사까지 모을지'
        default: '3'
      max_pages:
        description: '소스별 최대 페이지 수'
        default: '10'
      auto:
        description: '자동 실행 표시 (Worker 예약이 1로 보냄 — 이번 회차에 이미 실행했으면 건너뜀)'
        required: false
        default: ''

# 두 실행이 겹치면 같은 기사를 두 번 넣을 수 있어 차례로 실행
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 예비 예약은 GitHub 사정으로 몇 시간씩 밀려 실행되고, Worker 예약도 드물게 두 번 오므로
      # 이번 회차(06:10·13:10 KST 10분 전부터)에 앞선 실행이 이미 있으면 건너뜀 → 비공개 저장소 실행 시간·ScraperAPI 한도 절약
      # (Actions 화면에서 직접 누른 실행은 항상 실행)
      - name: 이번 회차 실행 확인 (예약·자동 실행만)
        id: chk
        if: github.event_name == 'schedule' || inputs.auto == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s); since=0
          for d in "$(date -u -d "@$now" +%F)" "$(date -u -d "@$((now - 86400))" +%F)"; do
            for hm in 04:00 21:00; do
              t=$(date -u -d "$d $hm" +%s)
              if [ "$t" -le "$now" ] && [ "$t" -gt "$since" ]; then since=$t; fi
            done
          done
          from=$(date -u -d "@$since" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/scrape.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }} and .created_at >= \"$from\" and .conclusion != \"failure\" and .conclusion != \"cancelled\")] | length")
          echo "이번 회차($from 이후) 앞선 실행: $n건"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout Repository
        if: steps.chk.outputs.skip != 'true'
        uses: actions/checkout@v5

      - name: Set up Python
        if: steps.chk.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        if: steps.chk.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt

      - name: Run Collector
        if: steps.chk.outputs.skip != 'true'
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          COLLECT_DAYS: ${{ inputs.days }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          python news.py
